<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>测测你的假期旅行人格</title>
<meta name="description" content="快速了解你最适合哪种旅行方式">
<style>
  :root{
    --accent: #ff7a45;
    --accent-soft: #ffe8dc;
    --ink:#1f1b16; --muted:#7a7268; --card:#ffffff; --bg:#f7f2ea;
    --radius:20px; --shadow:0 12px 32px rgba(60,42,20,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 600px at 10% -10%, var(--accent-soft), transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #ffe9c9, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    min-height:100vh;display:flex;justify-content:center;
    padding:24px 16px calc(24px + env(safe-area-inset-bottom));
  }
  .app{width:100%;max-width:560px}
  .screen{display:none;animation:in .35s ease both}
  .screen.active{display:block}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 24px}
  .cover{text-align:center;padding:40px 26px 32px}
  .cover .big-emoji{font-size:76px;line-height:1;margin-bottom:14px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.12))}
  h1{font-size:30px;line-height:1.25;margin:0 0 10px;letter-spacing:.5px}
  .subtitle{color:var(--muted);font-size:15px;line-height:1.7;margin:0 auto 22px;max-width:26em}
  .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:26px}
  .chip{background:var(--accent-soft);color:#8a5a1f;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600}
  .btn{
    display:block;width:100%;border:0;border-radius:999px;padding:16px 20px;font-size:17px;font-weight:700;
    background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 10px 22px rgba(255,122,69,.28);
    transition:transform .15s ease,box-shadow .15s ease
  }
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.06);border:1px solid #eadfd0}
  .hint{color:var(--muted);font-size:12px;margin-top:14px}
  /* 答题 */
  .progress{height:6px;background:#eee5d8;border-radius:999px;overflow:hidden;margin-bottom:8px}
  .progress > i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .3s ease}
  .meta-row{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:22px}
  .back{border:0;background:transparent;color:var(--muted);font-size:14px;cursor:pointer;padding:0}
  .qtext{font-size:23px;line-height:1.5;font-weight:700;margin:6px 0 24px;letter-spacing:.3px}
  .options{display:flex;flex-direction:column;gap:12px}
  .option{
    display:flex;align-items:center;gap:14px;text-align:left;width:100%;cursor:pointer;
    background:#fff;border:1.5px solid #eee2d2;border-radius:16px;padding:16px 18px;font-size:16.5px;
    color:var(--ink);line-height:1.5;transition:all .16s ease
  }
  .option:hover{border-color:var(--accent);transform:translateY(-1px)}
  .option:active{background:var(--accent-soft)}
  .option .letter{
    flex:0 0 26px;height:26px;border-radius:50%;background:var(--accent-soft);color:#8a5a1f;
    font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center
  }
  /* 结果 */
  .result{text-align:center}
  .result .big-emoji{font-size:82px;line-height:1;margin:2px 0 6px}
  .result .kicker{color:var(--muted);font-size:14px;letter-spacing:2px}
  .result h2{font-size:27px;margin:10px 0 12px}
  .tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
  .tag{background:var(--accent-soft);color:#8a5a1f;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600}
  .rarity{color:var(--muted);font-size:12.5px;margin:0 0 18px;letter-spacing:.5px}
  .desc{color:#4b443b;font-size:15.5px;line-height:1.85;text-align:left;background:#fbf7f1;border-radius:16px;padding:18px;margin-bottom:14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;text-align:left}
  .mini{background:#fbf7f1;border-radius:16px;padding:16px}
  .mini h3{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:1px}
  .mini p{margin:0;font-size:14px;line-height:1.65;color:#3f3a32}
  .match{background:#fff7ea;border:1px dashed #e8cfa8;border-radius:16px;padding:14px 16px;font-size:14px;color:#7a5622;text-align:left;margin-bottom:22px}
  .share{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
  .share .btn{padding:14px 12px;font-size:15px}
  .toast{
    position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);background:#1f1b16;color:#fff;
    padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s ease;z-index:9
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .footer{text-align:center;color:#a89b8a;font-size:12px;margin-top:18px}
  .footer a{color:#8a5a1f;text-decoration:none}
  @media (max-width:420px){ h1{font-size:26px} .qtext{font-size:20px} .cover{padding:32px 20px 26px} }
</style>
</head>
<body>
<div class="app">
  <!-- 封面 -->
  <div class="screen active" id="cover">
    <div class="card cover">
      <div class="big-emoji">🎯</div>
      <h1>测测你的假期旅行人格</h1>
      <p class="subtitle">快速了解你最适合哪种旅行方式</p>
      <div class="chips">
        <span class="chip">📝 8 道题</span>
        <span class="chip">⏱ 约 2 分钟</span>
        <span class="chip">🎭 8 种结果</span>
      </div>
      <button class="btn" onclick="startQuiz()">开始测试 →</button>
      <p class="hint">凭直觉选，没有标准答案</p>
    </div>
    <div class="footer">由 <b>Quiz Factory</b> 生成 · 单文件离线可用</div>
  </div>

  <!-- 答题 -->
  <div class="screen" id="quiz">
    <div class="card">
      <div class="progress"><i id="bar"></i></div>
      <div class="meta-row">
        <button class="back" onclick="prev()">← 上一题</button>
        <span id="counter"></span>
      </div>
      <div class="qtext" id="qtext"></div>
      <div class="options" id="options"></div>
    </div>
  </div>

  <!-- 结果 -->
  <div class="screen" id="result">
    <div class="card result">
      <div class="kicker" id="kicker">你 是</div>
      <div class="big-emoji" id="r-emoji"></div>
      <h2 id="r-name"></h2>
      <div class="tags" id="r-tags"></div>
      <div class="rarity" id="r-rarity"></div>
      <div class="desc" id="r-desc"></div>
      <div class="grid">
        <div class="mini"><h3>🌟 高光</h3><p id="r-strength"></p></div>
        <div class="mini"><h3>🌧 小毛病</h3><p id="r-weak"></p></div>
      </div>
      <div class="match" id="r-match"></div>
      <div class="share">
        <button class="btn" onclick="shareResult()">📤 分享结果</button>
        <button class="btn ghost" onclick="restart()">🔄 再测一次</button>
      </div>
      <p class="hint" id="r-hint"></p>
    </div>
    <div class="footer">我也想要一个专属测试 · <a href="#">也做一个</a></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const QUIZ = {"slug": "travel", "title": "测测你的假期旅行人格", "subtitle": "快速了解你最适合哪种旅行方式", "emoji": "🎯", "est_minutes": 2, "share_hint": "快来测测你的假期旅行人格，看看你是个怎样的旅行家", "axes": [{"key": "energy", "neg": "喜欢在家充电", "pos": "喜欢户外探险"}, {"key": "social", "neg": "宁愿独行", "pos": "爱结伴同行"}, {"key": "order", "neg": "随性而为", "pos": "事事安排妥当"}], "questions": [{"q": "假期第一天早上九点，你的打开方式是？", "options": [{"text": "背包出门，进山徒步", "scores": {"energy": 1}}, {"text": "找家咖啡馆发呆", "scores": {}}, {"text": "快乐地继续睡", "scores": {"energy": -1}}]}, {"q": "当计划一场旅行时，你通常会：", "options": [{"text": "提前订好酒店和交通", "scores": {"order": 1}}, {"text": "看看有没有突发的旅行灵感", "scores": {}}, {"text": "临时决定去哪里", "scores": {"order": -1}}]}, {"q": "这趟旅行的同伴，你倾向？", "options": [{"text": "组个搭子团才热闹", "scores": {"social": 1}}, {"text": "看缘分，遇到就聊", "scores": {}}, {"text": "一个人的自由行", "scores": {"social": -1}}]}, {"q": "在旅行的空闲时间，你更喜欢：", "options": [{"text": "在酒店休息充电", "scores": {"energy": -1}}, {"text": "到街边尝尝当地小吃", "scores": {}}, {"text": "去户外运动", "scores": {"energy": 1}}]}, {"q": "你对旅行计划的态度是：", "options": [{"text": "喜欢把行程安排得井井有条", "scores": {"order": 1}}, {"text": "喜欢临时决定怎么过", "scores": {}}, {"text": "不太擅长规划旅行", "scores": {"order": -1}}]}, {"q": "当你外出旅行时，你通常会：", "options": [{"text": "尽量和朋友保持联系", "scores": {"social": 1}}, {"text": "把手机设成飞行模式", "scores": {}}, {"text": "喜欢一个人静静享受旅程", "scores": {"social": -1}}]}, {"q": "你更喜欢：", "options": [{"text": "安排好一切再去旅行", "scores": {"order": 1}}, {"text": "随意走走，看看哪里好玩", "scores": {}}, {"text": "按部就班地完成旅行清单", "scores": {"order": -1}}]}, {"q": "你在旅行中会：", "options": [{"text": "喜欢结伴而行", "scores": {"social": 1}}, {"text": "选择安静的角落阅读", "scores": {}}, {"text": "独自探索新的地方", "scores": {"social": -1}}]}], "results": {"000": {"name": "懒猫 · 随遇而安", "emoji": "🐈", "tags": ["随性", "放松", "自由"], "desc": "你更愿意享受家的温馨，偶尔探索周边的小路，不拘泥于形式，随遇而安。", "strength": "你总能发现家附近的美好。", "weak": "有时可能忽略了一些远方的风景。", "match": "孤胆 · 硬核背包客"}, "001": {"name": "民宿 · 周边游搭子", "emoji": "🎲", "tags": ["轻松", "爱热闹", "低成本"], "desc": "远方可以不去，但朋友必须聚。你的假期是民宿桌游加周边小吃的组合，成本低，快乐不打折。", "strength": "把平凡日子过出聚会的味道，气氛担当。", "weak": "世界那么大，偶尔也想去看看，别总在家门口打转。", "match": "攻略 · 云旅行策划师"}, "010": {"name": "攻略 · 云旅行策划师", "emoji": "🗺️", "tags": ["云旅游", "收藏家", "信息控"], "desc": "人可以不到场，攻略必须做满。收藏夹里的路线图比很多人走过的路都长，万一哪天出发呢。", "strength": "信息储备拉满，朋友们出行前都来找你要攻略。", "weak": "云旅行久了，记得给自己也排一次真实的出发。", "match": "呼朋 · 郊野组局人"}, "011": {"name": "局王 · 聚会策划人", "emoji": "🎉", "tags": ["组织力", "热闹", "靠谱"], "desc": "你的假期日历排得满满当当——桌游局、周边一日游、美食探店，全都提前订好，一场不落。", "strength": "组织力强，跟着你混假期从不无聊。", "weak": "策划别人快乐的时候，记得也留一点安静给自己。", "match": "懒猫 · 随遇而安"}, "100": {"name": "呼朋 · 郊野组局人", "emoji": "🍢", "tags": ["户外", "气氛组", "随性"], "desc": "一喊人就到，选址全凭心情。郊野烧烤、河边露营，组织你的人越多，你玩得越嗨。", "strength": "天生的气氛组，有你在场面就热。", "weak": "说走就走的前提是人多，偶尔也试试一个人的旅行。", "match": "孤胆 · 硬核背包客"}, "101": {"name": "孤胆 · 硬核背包客", "emoji": "🎒", "tags": ["独立", "硬核", "计划控"], "desc": "独自穿越冷门线路，攻略精确到每个补给点。孤独对你不是问题，是自由的一部分。", "strength": "独立且周密，再难的线你也能自己拿下。", "weak": "一个人走路，偶尔也想要个能分享风景的人。", "match": "民宿 · 周边游搭子"}, "110": {"name": "社交 · 旅行达人", "emoji": "🌟", "tags": ["互动", "分享", "热情"], "desc": "你是个热情的旅行达人，总是能带动周围的人，分享旅途中的美好。", "strength": "你总能让旅途充满欢笑。", "weak": "有时可能过于热情让人感到压力。", "match": "局王 · 聚会策划人"}, "111": {"name": "平衡 · 旅行全才", "emoji": "🌍", "tags": ["综合", "平衡", "全能"], "desc": "你追求旅行的平衡，既能享受自然，也能体验文化，是个全能的旅行家。", "strength": "你总能带回来独特的旅行故事。", "weak": "有时可能觉得需要更多时间放松。", "match": "懒猫 · 随遇而安"}}, "cta": "我也想要一个专属测试", "thresholds": {"energy": 0, "social": 0, "order": 0}, "rarity": {"000": 14.9, "001": 13.9, "010": 13.9, "011": 12.9, "100": 11.9, "101": 11.1, "110": 11.1, "111": 10.3}};
const AXES = QUIZ.axes.map(a => a.key);
const RESULTS = QUIZ.results;
let index = 0, scores = {}, answers = [], lastDelta = {};
function resetScores(){ scores = {}; lastDelta = {}; AXES.forEach(k => { scores[k] = 0; lastDelta[k] = 0; }); }
function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active'); window.scrollTo({top:0,behavior:'smooth'}); }
function startQuiz(){ resetScores(); answers = []; index = 0; renderQuestion(); show('quiz'); }
function addScores(option){
  const s = option.scores || {};
  for (const k in s){
    const v = s[k];
    scores[k] = (scores[k]||0) + v;
    if (v) lastDelta[k] = v;
  }
}
function renderQuestion(){
  const q = QUIZ.questions[index];
  document.getElementById('bar').style.width = ((index) / QUIZ.questions.length * 100) + '%';
  document.getElementById('counter').textContent = (index+1) + ' / ' + QUIZ.questions.length;
  document.getElementById('qtext').textContent = q.q;
  const box = document.getElementById('options'); box.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerHTML = '<span class="letter">' + 'ABC'[i] + '</span><span></span>';
    btn.lastChild.textContent = opt.text;
    btn.onclick = () => choose(i);
    box.appendChild(btn);
  });
  document.getElementById('bar').style.width = ((index) / QUIZ.questions.length * 100) + '%';
}
function choose(i){
  const opt = QUIZ.questions[index].options[i];
  resetFromAnswers(index);
  answers[index] = i; addScores(opt); index++;
  if (index < QUIZ.questions.length) { renderQuestion(); }
  else { document.getElementById('bar').style.width = '100%'; renderResult(); }
}
function resetFromAnswers(upto){
  resetScores();
  for (let i = 0; i < upto; i++){ addScores(QUIZ.questions[i].options[answers[i]]); }
}
function prev(){
  if (index === 0) return;
  index--; resetFromAnswers(index); renderQuestion();
}
function resultKey(){
  const T = QUIZ.thresholds || {};
  return AXES.map(k => {
    const v = scores[k];
    const t = (typeof T[k] === 'number') ? T[k] : -0.5;
    if (v > t) return '1';
    if (v === t && (lastDelta[k] || 0) > 0) return '1';
    return '0';
  }).join('');
}
function renderResult(forcedKey){
  const key = forcedKey || resultKey();
  const r = RESULTS[key] || RESULTS[Object.keys(RESULTS)[0]];
  document.getElementById('r-emoji').textContent = r.emoji;
  document.getElementById('r-name').textContent = r.name;
  document.getElementById('r-desc').textContent = r.desc;
  document.getElementById('r-strength').textContent = r.strength;
  document.getElementById('r-weak').textContent = r.weak;
  document.getElementById('r-match').textContent = '💞 合拍类型：' + r.match;
  document.getElementById('r-tags').innerHTML = '';
  (r.tags || []).forEach(t => { const s = document.createElement('span'); s.className='tag'; s.textContent=t; document.getElementById('r-tags').appendChild(s); });
  const rare = (QUIZ.rarity && QUIZ.rarity[key]) || 0;
  if (rare) {
    const label = rare < 6 ? '隐藏款' : rare < 10 ? '稀有' : rare < 15 ? '少见' : '常见';
    document.getElementById('r-rarity').textContent = '稀有度 ' + label + ' · 只有 ' + rare + '% 的人会测到';
  } else { document.getElementById('r-rarity').textContent = ''; }
  document.getElementById('r-hint').textContent = QUIZ.share_hint;
  try { history.replaceState(null, '', '#r=' + key); } catch(e) {}
  show('result');
}
function restart(){ try { history.replaceState(null, '', location.pathname + location.search); } catch(e) {}
  resetScores(); answers = []; index = 0; show('cover'); }
function toast(msg){ const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(window.__toastTimer); window.__toastTimer = setTimeout(() => el.classList.remove('show'), 1800); }
function shareResult(){
  const key = resultKey();
  const url = location.origin + location.pathname + location.search + '#r=' + key;
  const text = '我测出来是「' + document.getElementById('r-name').textContent + '」，你也来测测？';
  if (navigator.share) { navigator.share({title: QUIZ.title, text: text, url: url}).catch(() => {}); return; }
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = url; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('链接已复制，去粘贴给朋友吧'); } catch(e) { toast(url); }
    document.body.removeChild(ta); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(() => toast('链接已复制，去粘贴给朋友吧')).catch(fallback);
  } else { fallback(); }
}
(function deepLink(){
  const m = (location.hash || '').match(/^#r=([01]{3})$/);
  if (m && RESULTS[m[1]]) {
    document.getElementById('kicker').textContent = 'TA 是';
    renderResult(m[1]);
    document.getElementById('kicker').textContent = 'TA 是';
  }
})();
</script>
</body>
</html>
